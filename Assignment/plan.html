<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
   <link rel="stylesheet" href="style.css">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Multi-step form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
  <div class="sidebar">
    <img src="bg-sidebar-desktop.svg" class="bg" alt="">

  <div class="step active">
    <span class="number">1</span>
    <div class="text">
        <small>STEP 1</small>
        <h4>YOUR INFO</h4>
    </div>
</div>

<div class="step">
    <span class="number">2</span>
    <div class="text">
        <small>STEP 2</small>
        <h4>SELECT PLAN</h4>
    </div>
</div>

<div class="step">
    <span class="number">3</span>
    <div class="text">
        <small>STEP 3</small>
        <h4>ADD-ONS</h4>
    </div>
</div>

<div class="step">
    <span class="number">4</span>
    <div class="text">
        <small>STEP 4</small>
        <h4>SUMMARY</h4>
    </div>
</div>

</div>
<div class="form-container">

    <h1>Select your plan</h1>

    <p class="description">
        You have the option of monthly or yearly billing.
    </p>

    <div class="plans">

        <div class="plan active">
            <img src="assets/images/icon-arcade.svg" alt="">
            <h3>Arcade</h3>
            <p id="arcade-price">$9/mo</p>
             <small id="arcade-free"></small>
        </div>

        <div class="plan">
            <img src="assets/images/icon-advanced.svg" alt="">
            <h3>Advanced</h3>
            <p id="advanced-price">$12/mo</p>
             <small id="advanced-free"></small>
        </div>

        <div class="plan">
            <img src="assets/images/icon-pro.svg" alt="">
            <h3>Pro</h3>
            <p id="pro-price">$15/mo</p>
            <small id="pro-free"></small>
        </div>

    </div>

    <div class="billing">
        <span id="monthly" class="active-text">Monthly</span>

        <label class="switch">
            <input type="checkbox" id="toggle">
            <span class="slider"></span>
        </label>

        <span id="yearly">Yearly</span>
    </div>

    <div class="buttons">
        <a href="index.html" class="back">Go Back</a>

        <a href="step3.html" class="next">Next Step</a>
    </div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
