<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
   <link rel="stylesheet" href="style.css">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Multi-step form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
  <div class="sidebar">
    <img src="bg-sidebar-desktop.svg" class="bg" alt="">

  <div class="step active">
    <span class="number">1</span>
    <div class="text">
        <small>STEP 1</small>
        <h4>YOUR INFO</h4>
    </div>
</div>

<div class="step">
    <span class="number">2</span>
    <div class="text">
        <small>STEP 2</small>
        <h4>SELECT PLAN</h4>
    </div>
</div>

<div class="step">
    <span class="number">3</span>
    <div class="text">
        <small>STEP 3</small>
        <h4>ADD-ONS</h4>
    </div>
</div>

<div class="step">
    <span class="number">4</span>
    <div class="text">
        <small>STEP 4</small>
        <h4>SUMMARY</h4>
    </div>
</div>
</div>
<div class="form-container">

    <h1>Personal info</h1>

    <p class="description">
        Please provide your name, email address, and phone number.
    </p>

    <form>

        <label for="name">Name</label>
        <input type="text" required, id="name" placeholder="e.g. Stephen King">

        <label for="email">Email Address</label>
        <input type="email" required, id="email" placeholder="e.g. stephenking@lorem.com">

        <label for="phone">Phone Number</label>
        <input type="tel" required, id="phone" placeholder="e.g. +1 234 567 890">

        <a href="plan.html" class="next-btn" onclick="saveData()">Next Step </a>
        

    </form>

</div>
</div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Olamide Amode</a>
  </footer>
  <script src="script.js"></script>
</body>
</html>
