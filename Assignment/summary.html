<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Step 4 - Summary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="step">
            <span class="step-number">1</span>

            <div>
                <small>STEP 1</small>
                <strong>YOUR INFO</strong>
            </div>
        </div>

        <div class="step">
            <span class="step-number">2</span>

            <div>
                <small>STEP 2</small>
                <strong>SELECT PLAN</strong>
            </div>
        </div>

        <div class="step">
            <span class="step-number">3</span>

            <div>
                <small>STEP 3</small>
                <strong>ADD-ONS</strong>
            </div>
        </div>

        <div class="step active">
            <span class="step-number">4</span>

            <div>
                <small>STEP 4</small>
                <strong>SUMMARY</strong>
            </div>
        </div>

    </aside>


    <main class="form-container">

        <h1>Finishing up</h1>

        <p class="description">
            Double-check everything looks OK before confirming.
        </p>


        <div class="summary-box">

            <div class="summary-plan">

                <div>

                    <h3 id="summary-plan">
                        Arcade (Monthly)
                    </h3>

                    <a href="plan.html">
                        Change
                    </a>

                </div>

                <strong id="summary-plan-price">
                    $9/mo
                </strong>

            </div>


            <hr>


            <div id="summary-addons">

            </div>

        </div>


        <div class="total">

            <span id="total-label">
                Total (per month)
            </span>

            <strong id="total-price">
                +$12/mo
            </strong>

        </div>


        <div class="buttons">

            <a href="step3.html" class="back">
                Go Back
            </a>

            <a href="thankyou.html" class="confirm">
                Confirm
            </a>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
